<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>База знаний кофейни</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #FEF8FA;
            padding: 20px 16px 40px;
            min-height: 100vh;
            color: #2B2B2B;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            font-size: 30px;
            font-weight: 800;
            color: #2B2B2B;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .sub {
            color: #2B2B2B;
            font-size: 15px;
            border-left: 4px solid #E62369;
            padding-left: 12px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            align-items: center;
        }
        .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 60px;
            border: 2px solid #FAD4DE;
            background: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 2px 12px rgba(230, 35, 105, 0.05);
            color: #2B2B2B;
        }
        .search-wrap input:focus {
            border-color: #70C7D8;
            box-shadow: 0 4px 16px rgba(112, 199, 216, 0.25);
        }
        .search-wrap::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: #D2F0F2;
            border: none;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #2B7A8A;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: #FFD1DC;
            color: #8B234A;
        }
        .filter-btn:active {
            transform: scale(0.95);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        @media (min-width: 900px) {
            .grid { grid-template-columns: 1fr 1fr 1fr; }
        }

        .card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 20px 20px;
            box-shadow: 0 6px 20px rgba(230, 35, 105, 0.05);
            border: 1px solid #FAD4DE;
            text-decoration: none;
            color: #2B2B2B;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }
        .card:active {
            background: #FEF8FA;
            transform: scale(0.97);
        }
        .card:hover {
            box-shadow: 0 8px 24px rgba(230, 35, 105, 0.1);
            transform: translateY(-2px);
        }
        .card.hidden {
            display: none;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }
        .card-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #2B2B2B;
            margin: 0;
            line-height: 1.3;
        }
        .badge {
            background: #D2F0F2;
            color: #2B7A8A;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .category-tag {
            font-size: 12px;
            background: #FFD1DC;
            color: #8B234A;
            padding: 3px 12px;
            border-radius: 30px;
            align-self: flex-start;
            margin: 4px 0 0;
            font-weight: 500;
        }
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #B8A0AA;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #B8A0AA;
            font-size: 13px;
            border-top: 1px solid #FAD4DE;
            padding-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>База знаний кофейни</h1>
    <div class="sub">Навигатор для сотрудников — все инструкции, рецепты и стандарты в одном месте</div>

    <div class="controls">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." oninput="applyFilters()">
        </div>
        <div class="filter-buttons" id="filterButtons">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="кофе">Кофе</button>
            <button class="filter-btn" data-category="меню">Меню</button>
            <button class="filter-btn" data-category="сервис">Сервис</button>
            <button class="filter-btn" data-category="стандарты">Стандарты</button>
            <button class="filter-btn" data-category="касса">Касса</button>
            <button class="filter-btn" data-category="кухня">Кухня</button>
        </div>
    </div>

    <div class="grid" id="cardGrid"></div>

    <div class="footer">Обновлено: 30.09.2026</div>
</div>

<script>
    const data = {
        "Кофе": [
            { title: "Технологические карты кофе и айс-кофе", url: "napitki.html", badge: "Составы" },
            { title: "Технологические карты чаи и матча", url: "chai.html", badge: "Составы" },
            { title: "Технологические карты смузи, лимонады, милкшейки", url: "smoothie.html", badge: "Составы" },
            { title: "Барное оборудование и инвентарь", url: "equipment.html", badge: "Инструкция" },
            { title: "Вкусовой круг", url: "#", badge: "Справочник" },
            { title: "Чистка кофемолки (видео)", url: "#", badge: "Видео" },
            { title: "Промывание тачки утром (видео)", url: "#", badge: "Видео" },
            { title: "Настройка помола (видео)", url: "#", badge: "Видео" }
        ],
        "Меню": [
            { title: "Десерты (составы, описания)", url: "deserts.html", badge: "Составы" },
            { title: "Меню кухни (составы, описания)", url: "kitchen.html", badge: "Составы" }
        ],
        "Сервис": [
            { title: "Прием заказа", url: "#", badge: "Скрипты" },
            { title: "Бонусная программа", url: "bonus.html", badge: "Инструкция" },
            { title: "Бесплатный кофе за отзыв", url: "#", badge: "Акция" }
        ],
        "Стандарты": [
            { title: "Должностная инструкция бариста", url: "#", badge: "Документ" },
            { title: "Внутренние правила для сотрудников кофейни", url: "#", badge: "Правила" },
            { title: "Сроки хранения продуктов и заготовок на баре", url: "#", badge: "Стандарт" },
            { title: "Маркировка и контроль сроков десертов", url: "#", badge: "Стандарт" },
            { title: "Стандарт витрины", url: "#", badge: "Стандарт" },
            { title: "Стандарт сервировки столов", url: "#", badge: "Стандарт" },
            { title: "Стандарты чистоты", url: "#", badge: "Стандарт" }
        ],
        "Касса": [
            { title: "Инструкция по работе с доставкой ЯндексЕда", url: "#", badge: "Инструкция" },
            { title: "Правила заказа десертов в iiko Office (Вологда)", url: "#", badge: "Инструкция" },
            { title: "Скидка для офиса", url: "#", badge: "Инструкция" },
            { title: "Работа с подарочными сертификатами", url: "#", badge: "Инструкция" }
        ],
        "Кухня": [
            { title: "Заготовки в заморозке", url: "#", badge: "Сроки" },
            { title: "Заготовки и сроки хранения в холодильнике", url: "#", badge: "Сроки" },
            { title: "Сроки хранения заготовок на кухне", url: "#", badge: "Сроки" },
            { title: "Стандарты упаковки блюд кухни (выдача с собой и доставка)", url: "#", badge: "Стандарт" },
            { title: "Инструкция прием продуктов", url: "#", badge: "Инструкция" },
            { title: "Оборудование кухни", url: "#", badge: "Инструкция" },
            { title: "Товарное соседство в холодильнике", url: "#", badge: "Стандарт" },
            { title: "Технологические карты и полуфабрикаты", url: "#", badge: "ТТК" },
            { title: "Полуфабрикаты на панкейки", url: "#", badge: "Рецепт" }
        ]
    };

    const grid = document.getElementById('cardGrid');
    const searchInput = document.getElementById('searchInput');
    let currentCategory = 'all';

    function renderAll(filter = '', category = 'all') {
        let html = '';
        let anyVisible = false;
        const lowerFilter = filter.toLowerCase();

        for (const [cat, items] of Object.entries(data)) {
            let cardHtml = '';
            let catHasVisible = false;

            const categoryMatch = category === 'all' || cat.toLowerCase() === category;

            items.forEach(item => {
                const searchMatch = lowerFilter === '' || item.title.toLowerCase().includes(lowerFilter);
                const show = searchMatch && categoryMatch;
                if (show) { catHasVisible = true; anyVisible = true; }

                const badge = item.badge ? `<span class="badge">${item.badge}</span>` : '';
                cardHtml += `
                    <a href="${item.url}" target="_blank" class="card ${show ? '' : 'hidden'}">
                        <div class="card-header">
                            <h2>${item.title}</h2>
                            ${badge}
                        </div>
                        <div class="category-tag">${cat}</div>
                    </a>
                `;
            });

            html += `
                <div class="category-block ${catHasVisible ? '' : 'hidden'}">
                    ${cardHtml}
                </div>
            `;
        }

        if (!anyVisible && filter.trim() !== '') {
            html = `<div class="empty">Ничего не найдено. Попробуйте другой запрос.</div>`;
        }

        grid.innerHTML = html;
    }

    function applyFilters() {
        const searchTerm = searchInput.value.trim();
        renderAll(searchTerm, currentCategory);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            applyFilters();
        });
    });

    renderAll('', 'all');
</script>
</body>
</html>
