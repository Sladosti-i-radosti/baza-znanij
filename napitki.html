<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>База знаний — Напитки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #faf7f2;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #3e2723;
            margin-bottom: 6px;
        }
        .header .sub {
            color: #6d4c41;
            font-size: 15px;
            border-left: 4px solid #a1887f;
            padding-left: 12px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            align-items: center;
        }
        .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 18px 12px 48px;
            border-radius: 60px;
            border: 1px solid #d7ccc8;
            background: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .search-wrap input:focus {
            border-color: #8d6e63;
            box-shadow: 0 4px 12px rgba(109,76,65,0.15);
        }
        .search-wrap::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: #efebe9;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #4e342e;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: #8d6e63;
            color: white;
        }
        .filter-btn:active {
            transform: scale(0.95);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #efe6e0;
            display: flex;
            flex-direction: column;
            transition: 0.15s;
        }
        .card.hidden {
            display: none;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }
        .card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #3e2723;
            margin: 0;
        }
        .volume {
            background: #efebe9;
            color: #4e342e;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .category-tag {
            font-size: 12px;
            background: #e0d6cf;
            color: #4e342e;
            padding: 2px 10px;
            border-radius: 30px;
            align-self: flex-start;
            margin: 4px 0 8px;
        }
        .section {
            margin-top: 12px;
            border-top: 1px solid #f1ebe7;
            padding-top: 10px;
        }
        .section:first-of-type {
            border-top: none;
            padding-top: 0;
        }
        .section-title {
            font-weight: 600;
            font-size: 14px;
            color: #6d4c41;
            margin-bottom: 4px;
        }
        .section-content {
            font-size: 14px;
            line-height: 1.6;
            color: #3e2723;
        }
        .ingredient-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }
        .ingredient-item {
            background: #f5f0ec;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
        }
        .extra {
            background: #fce4ec;
            color: #c62828;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-top: 4px;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #8d6e63;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #a1887f;
            font-size: 13px;
            border-top: 1px solid #e0d6cf;
            padding-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>База знаний кофейни</h1>
        <div class="sub">Технологические карты напитков</div>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Поиск по названию или ингредиенту..." oninput="applyFilters()">
        </div>
        <div class="filter-buttons" id="filterButtons">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="эспрессо">Эспрессо</button>
            <button class="filter-btn" data-category="черный кофе">Черный</button>
            <button class="filter-btn" data-category="с молоком">С молоком</button>
        </div>
    </div>

    <div class="grid" id="cardGrid"></div>

    <div class="footer">Обновлено: 04.08.2026</div>
</div>

<script>
    // ============================================================
    // ДАННЫЕ НАПИТКОВ
    // ============================================================
    const drinks = [
        {
            name: "Эспрессо",
            volume: "40 мл",
            category: "эспрессо",
            ingredients: ["Эспрессо двойной"],
            extra: "Молоко, сливки, сироп",
            technology: "В кофемолке намолоть 18 грамм кофе (двойной холдер). Сделать темперовку с помощью темпера. Далее закрепить холдер в группе кофемашины. Незамедлительно включить кнопку пролива. На выходе получается двойной эспрессо 36 гр.",
            description: "Крепкий кофе с нотками цитруса, сухофруктов и орехов и послевкусием шоколада.",
            serving: "Эспрессо выдается в чашках, на блюдце с чайной ложкой со стаканом воды."
        },
        {
            name: "Американо стандарт",
            volume: "200 мл",
            category: "черный кофе",
            ingredients: ["Двойной эспрессо", "Вода из бойлера", "Печенька"],
            extra: "Молоко, сливки, альтернативное молоко, сироп, доп. шот эспрессо",
            technology: "Готовим двойной эспрессо. Далее заливаем горячей водой из бойлера.",
            description: "Кофе средней крепости с нотками цитруса, сухофруктов и орехов и послевкусием шоколада.",
            serving: "Американо подается в чашке 200 мл на блюдце, с ложкой и печенькой."
        },
        {
            name: "Фильтр 200 мл",
            volume: "200 мл",
            category: "черный кофе",
            ingredients: ["Альтернативный способ приготовления", "Черный кофе"],
            extra: "Молоко, сливки, альтернативное молоко, сироп",
            technology: "Как сделать фильтр кофе: 1,6 литра воды фильтрованной, 100 гр зерна для фильтра, помол в гриндере для фильтра выставляем на 16.",
            description: "Чистый вкус кофе, обладает яркими и свежими нотами, с ароматом фруктов и цветов.",
            serving: "Фильтр выдается в чашке на 200 мл — стандартный, на блюдце с ложкой."
        },
        {
            name: "Фильтр 300 мл",
            volume: "300 мл",
            category: "черный кофе",
            ingredients: ["Альтернативный способ приготовления", "Черный кофе"],
            extra: "Молоко, сливки, альтернативное молоко, сироп",
            technology: "Как сделать фильтр кофе: 1,6 литра воды фильтрованной, 100 гр зерна для фильтра, помол в гриндере для фильтра выставляем на 16.",
            description: "Чистый вкус кофе, обладает яркими и свежими нотами, с ароматом фруктов и цветов.",
            serving: "Фильтр выдается в чашке на 300 мл — большой, на блюдце с ложкой."
        },
        {
            name: "Капучино стандарт",
            volume: "200 мл",
            category: "с молоком",
            ingredients: ["Одинарный эспрессо (18 мл)", "Молоко 3,2% (160 мл)", "Печенька к кофе (1 шт.)"],
            extra: "Альтернативное молоко, сироп",
            technology: "Готовим двойной эспрессо. Разделяем его с помощью малых питчеров. 1 эспрессо используем для приготовления капучино, второй можно использовать в приготовлении других напитков в течение 1 мин. Далее отдельно в питчере взбиваем молоко. Затем вливаем молоко в эспрессо. Температура молока составляет 60-65 градусов.",
            description: "Идеальное сочетание насыщенного эспрессо и нежной молочной пены.",
            serving: "Капучино выдается в чашке на 200 мл на блюдце, с ложкой и печенькой."
        },
        {
            name: "Капучино большой",
            volume: "300 мл",
            category: "с молоком",
            ingredients: ["Двойной эспрессо (36 мл)", "Молоко 3,2% (200 мл)", "Печенька к кофе (1 шт.)"],
            extra: "Альтернативное молоко, сироп",
            technology: "Готовим двойной эспрессо. Далее отдельно в питчере взбиваем молоко. Затем вливаем молоко в эспрессо.",
            description: "Двойная порция сбалансированного вкуса насыщенного эспрессо и нежной молочной пены.",
            serving: "Капучино выдается в чашке на 300 мл на блюдце, с ложкой и печенькой."
        }
    ];

    // ============================================================
    // РЕНДЕР И ФИЛЬТРАЦИЯ
    // ============================================================
    const grid = document.getElementById('cardGrid');
    const searchInput = document.getElementById('searchInput');

    let currentCategory = 'all';

    function renderCards() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        let html = '';
        let visibleCount = 0;

        drinks.forEach(d => {
            const categoryMatch = currentCategory === 'all' || d.category === currentCategory;
            const searchMatch = searchTerm === '' ||
                d.name.toLowerCase().includes(searchTerm) ||
                d.ingredients.some(i => i.toLowerCase().includes(searchTerm)) ||
                d.technology.toLowerCase().includes(searchTerm) ||
                d.description.toLowerCase().includes(searchTerm) ||
                (d.extra && d.extra.toLowerCase().includes(searchTerm));
            const show = categoryMatch && searchMatch;
            if (show) visibleCount++;

            const ingredientsHtml = d.ingredients.map(i => `<span class="ingredient-item">${i}</span>`).join('');

            let extraHtml = '';
            if (d.extra && d.extra.trim() !== '') {
                extraHtml = `<div class="section"><div class="section-title">➕ Дополнительные ингредиенты</div><div class="section-content"><span class="extra">${d.extra}</span></div></div>`;
            }

            const cardHtml = `
                <div class="card ${show ? '' : 'hidden'}">
                    <div class="card-header">
                        <h2>${d.name}</h2>
                        <span class="volume">${d.volume}</span>
                    </div>
                    <div class="category-tag">${d.category}</div>
                    <div class="section">
                        <div class="section-title">🛒 Состав</div>
                        <div class="section-content ingredient-list">${ingredientsHtml}</div>
                    </div>
                    ${extraHtml}
                    <div class="section">
                        <div class="section-title">👨‍🍳 Технология</div>
                        <div class="section-content">${d.technology}</div>
                    </div>
                    <div class="section">
                        <div class="section-title">📝 Вкусное описание</div>
                        <div class="section-content">${d.description}</div>
                    </div>
                    <div class="section">
                        <div class="section-title">🍽 Подача</div>
                        <div class="section-content">${d.serving}</div>
                    </div>
                </div>
            `;
            html += cardHtml;
        });

        if (visibleCount === 0) {
            html = `<div class="empty">😕 Ничего не найдено. Попробуйте изменить запрос.</div>`;
        }

        grid.innerHTML = html;
    }

    function applyFilters() {
        renderCards();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            renderCards();
        });
    });

    renderCards();
</script>
</body>
</html>
