    <title>База знаний — Напитки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #faf7f2;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #3e2723;
            margin-bottom: 6px;
        }
        .header .sub {
            color: #6d4c41;
            font-size: 15px;
            border-left: 4px solid #a1887f;
            padding-left: 12px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            align-items: center;
        }
        .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 18px 12px 48px;
            border-radius: 60px;
            border: 1px solid #d7ccc8;
            background: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .search-wrap input:focus {
            border-color: #8d6e63;
            box-shadow: 0 4px 12px rgba(109,76,65,0.15);
        }
        .search-wrap::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: #efebe9;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #4e342e;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: #8d6e63;
            color: white;
        }
        .filter-btn:active {
            transform: scale(0.95);
        }

        .toc {
            background: #f5f0ec;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }
        .toc a {
            color: #4e342e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.15s;
        }
        .toc a:hover {
            border-bottom-color: #8d6e63;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #efe6e0;
            display: flex;
            flex-direction: column;
            transition: 0.15s;
        }
        .card.hidden {
            display: none;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }
        .card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #3e2723;
            margin: 0;
        }

            background: #efebe9;
            color: #4e342e;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
        }

            font-size: 12px;
            background: #e0d6cf;
            color: #4e342e;
            padding: 2px 10px;
            border-radius: 30px;
            align-self: flex-start;
            margin: 4px 0 8px;
        }
        .section {
            margin-top: 12px;
            border-top: 1px solid #f1ebe7;
            padding-top: 10px;
        }
        .section:first-of-type {
            border-top: none;
            padding-top: 0;
        }
        .section-title {
            font-weight: 600;
            font-size: 14px;
            color: #6d4c41;
            margin-bottom: 4px;
        }
        .section-content {
            font-size: 14px;
            line-height: 1.6;
            color: #3e2723;
        }
        .ingredient-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }
        .ingredient-item {
            background: #f5f0ec;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
        }
        .extra {
            background: #fce4ec;
            color: #c62828;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-top: 4px;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #8d6e63;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #a1887f;
            font-size: 13px;
            border-top: 1px solid #e0d6cf;
            padding-top: 24px;
        }
        @media (max-width: 600px) {
            .toc {
                gap: 6px 12px;
            }
            .toc a {
                font-size: 13px;
            }
        }
    </style>
</head>
