<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>База знаний — Чаи и матча</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #FEF8FA;
            padding: 20px 16px 40px;
            min-height: 100vh;
            color: #2B2B2B;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 30px;
            font-weight: 800;
            color: #2B2B2B;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .header .sub {
            color: #2B2B2B;
            font-size: 15px;
            border-left: 4px solid #E62369;
            padding-left: 12px;
            line-height: 1.5;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            align-items: center;
        }
        .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border-radius: 60px;
            border: 2px solid #FAD4DE;
            background: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 2px 12px rgba(230, 35, 105, 0.05);
            color: #2B2B2B;
        }
        .search-wrap input:focus {
            border-color: #70C7D8;
            box-shadow: 0 4px 16px rgba(112, 199, 216, 0.25);
        }
        .search-wrap::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: #D2F0F2;
            border: none;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #2B7A8A;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: #FFD1DC;
            color: #8B234A;
        }
        .filter-btn:active {
            transform: scale(0.95);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 600px) {
            .grid { grid-template-columns: 1fr 1fr; }
        }
        @media (min-width: 900px) {
            .grid { grid-template-columns: 1fr 1fr 1fr; }
        }

        .card {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 22px 20px;
            box-shadow: 0 6px 20px rgba(230, 35, 105, 0.05);
            border: 1px solid #FAD4DE;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }
        .card.hidden { display: none; }
        .card:hover {
            box-shadow: 0 8px 24px rgba(230, 35, 105, 0.1);
            transform: translateY(-2px);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }
        .card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #2B2B2B;
            margin: 0;
            line-height: 1.3;
        }
        .volume {
            background: #D2F0F2;
            color: #2B7A8A;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .category-tag {
            font-size: 12px;
            background: #FFD1DC;
            color: #8B234A;
            padding: 3px 12px;
            border-radius: 30px;
            align-self: flex-start;
            margin: 4px 0 10px;
            font-weight: 500;
        }
        .section {
            margin-top: 14px;
            border-top: 1px solid #FAD4DE;
            padding-top: 12px;
        }
        .section:first-of-type { border-top: none; padding-top: 0; }
        .section-title {
            font-weight: 700;
            font-size: 13px;
            color: #E62369;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section-content {
            font-size: 14px;
            line-height: 1.6;
            color: #2B2B2B;
        }
        .ingredient-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 8px;
        }
        .ingredient-item {
            background: #D2F0F2;
            color: #2B7A8A;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #B8E4E8;
        }
        .extra {
            background: #FFD1DC;
            color: #8B234A;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-top: 4px;
            font-weight: 500;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #B8A0AA;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #B8A0AA;
            font-size: 13px;
            border-top: 1px solid #FAD4DE;
            padding-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Чаи и матча</h1>
        <div class="sub">Технологические карты напитков</div>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Поиск по названию или ингредиенту..." oninput="applyFilters()">
        </div>
        <div class="filter-buttons" id="filterButtons">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="чай">Чаи</button>
            <button class="filter-btn" data-category="матча">Матча</button>
        </div>
    </div>

    <div class="grid" id="cardGrid"></div>

    <div class="footer">Обновлено: 30.09.2026 · Версия 2.0</div>
</div>

<script>
    const drinks = [
        // ===== ЧАИ =====
        {
            name: "Чай Черная смородина - Яблоко",
            volume: "800 мл",
            category: "чай",
            ingredients: ["Чай Ассам (5 гр)", "Пюре черной смородины (50 гр)", "Сок яблоко (100 мл)", "Черная смородина зам. (10 гр)", "Яблоко свеж (10 гр)"],
            extra: "",
            technology: "Все компоненты собрать в чайник 800 мл. Залить горячей водой из бойлера, определенной соответствующей температуры. 93 градуса (не кипятим). Перемешать барной ложкой. Дать настояться 1-2 мин.",
            description: "Сочетание сладковатого яблока и терпкой черной смородины создает сбалансированный, слегка сладкий и освежающий напиток с приятным ягодно-фруктовым ароматом и мягким послевкусием.",
            serving: "Подается в чайнике 800 мл и с чайной парой."
        },
        {
            name: "Чай Вишня - Тимьян",
            volume: "800 мл",
            category: "чай",
            ingredients: ["Чай Эрл Грей (5 гр)", "Пюре вишни (50 гр)", "Сок вишня (100 мл)", "Вишня зам. (10 гр)", "Тимьян (1 гр, пару веточек)", "Лимон свеж (20 гр)"],
            extra: "",
            technology: "Все компоненты собрать в чайник 800 мл. Залить горячей водой из бойлера, определенной соответствующей температуры. 93 градуса (не кипятим). Перемешать барной ложкой. Дать настояться 1-2 мин.",
            description: "Сочетает сладко-терпкие ягодные ноты вишни с острым, пряным и ароматным оттенком тимьяна (чабреца).",
            serving: "Подается в чайнике 800 мл и с чайной парой."
        },
        {
            name: "Чай Облепиха - Розмарин",
            volume: "800 мл",
            category: "чай",
            ingredients: ["Чай Сенча (5 гр)", "Пюре облепиха с имбирем (50 гр)", "Мед (30 мл)", "Облепиха зам. (10 гр)", "Розмарин (1 гр, пару веточек)", "Апельсин свеж (20 гр)"],
            extra: "",
            technology: "Все компоненты собрать в чайник 800 мл. Залить горячей водой из бойлера, определенной соответствующей температуры. 85 градусов (не кипятим). Перемешать барной ложкой. Дать настояться 1-2 мин.",
            description: "Терпко-сладкий за счёт облепихи, травянистый с хвойными нотками от розмарина и пряный, согревающий с лёгкой остринкой от имбиря.",
            serving: "Подается в чайнике 800 мл и с чайной парой."
        },
        {
            name: "Чай Малина - Мята",
            volume: "800 мл",
            category: "чай",
            ingredients: ["Чай Ассам (5 гр)", "Пюре малина (50 гр)", "Малина зам. (10 гр)", "Мята свеж (3 гр)"],
            extra: "",
            technology: "Все компоненты собрать в чайник 800 мл. Залить горячей водой из бойлера, определенной соответствующей температуры. 93 градуса (не кипятим). Перемешать барной ложкой. Дать настояться 1-2 мин.",
            description: "Обладает гармоничным вкусом, где сладкие и слегка терпкие ягодные ноты малины сочетаются с освежающей прохладой мяты, создавая сбалансированный ягодно-травяной профиль.",
            serving: "Подается в чайнике 800 мл и с чайной парой."
        },
        {
            name: "Чай Черный/Зеленый",
            volume: "800 мл",
            category: "чай",
            ingredients: ["Черный/Зеленый чай (5 гр)", "Вода горячая (800 мл)"],
            extra: "",
            technology: "Залить порцию чая горячей водой из бойлера, определенной соответствующей температуры. 93/85 градуса (не кипятим).",
            description: "Черный — насыщенный, крепкий и терпкий вкус с солодовыми, медовыми и пряными нотками. Зеленый — освежающий травянистый вкус с лёгкой сладостью, терпкостью и нотками орехов и морской свежести.",
            serving: "Подается в чайнике 800 мл и с чайной парой."
        },
        {
            name: "Чай Гречишный",
            volume: "800 мл",
            category: "чай",
            ingredients: ["Гречишный чай (12 гр)", "Вода горячая (800 мл)"],
            extra: "",
            technology: "Залить порцию чая горячей водой из бойлера, определенной соответствующей температуры. 93 градуса (не кипятим).",
            description: "Мягкий, сладковатый вкус с нотками карамели, орехов, сливок и хлеба, напоминающий сдобную выпечку или овсяное печенье.",
            serving: "Подается в чайнике 800 мл и с чайной парой."
        },
        {
            name: "Чай Жасмин - Черная смородина",
            volume: "470 мл",
            category: "чай",
            ingredients: ["Чай зеленый с жасмином (5 гр)", "Пюре черной смородины (50 гр)", "Крем кокос (80 гр)"],
            extra: "",
            technology: "Завариваем чай 5 гр на 500 мл в заготовку (обязательно процеживаем). Готовим крем: шантипак 45 мл, молоко безлактозное 25 мл, сироп кокос 10 мл взбиваем капучинатором до однородной массы консистенция крема или густой сметаны. Хайбол наполняем полностью льдом, вливаем чай комнатной температуры 170 мл. Далее вливаем черносмородиновое пюре. Сверху выкладываем шапку из крема.",
            description: "Идеальное сочетание жасмина и черной смородины. Утоляющий жажду чай со сливочной шапочкой крема.",
            serving: "Подача в кофейне в хайболе 500 мл с прозрачной трубочкой. С собой в пластиковом стакане плотном на 500 мл с крышечкой для кофе и трубочкой прозрачной."
        },

        // ===== МАТЧА =====
        {
            name: "Матча зеленая",
            volume: "200 мл",
            category: "матча",
            ingredients: ["Матча зеленая (1,5 гр)", "Молоко 3,2% (160 мл)"],
            extra: "Альтернативное молоко, сироп",
            technology: "Матчу смешать с небольшим количеством воды, температура 75 градусов, тщательно перемешать. Далее влить в чашку. Отдельно взбить молоко. Затем влить молоко по технологии приготовления как капучино.",
            description: "Нежный, сладковатый вкус с травяными нотками с послевкусием луговых цветов и меда.",
            serving: "Матча подается в роксе 200 мл."
        },
        {
            name: "Матча голубая",
            volume: "200 мл",
            category: "матча",
            ingredients: ["Матча голубая (1,5 гр)", "Молоко 3,2% (160 мл)"],
            extra: "Альтернативное молоко, сироп",
            technology: "Матчу смешать с небольшим количеством воды, температура 75 градусов, тщательно перемешать. Далее влить в чашку. Отдельно взбить молоко. Затем влить молоко по технологии приготовления как капучино.",
            description: "Мягкий и цветочный вкус.",
            serving: "Матча подается в роксе 200 мл."
        },
        {
            name: "Айс-матча-латте",
            volume: "200 мл",
            category: "матча",
            ingredients: ["Матча (1,5 г)", "Молоко 3,2% (100 мл)", "Лёд (полный стакан)"],
            extra: "Альтернативное молоко, сироп (рекомендуется)",
            technology: "В стакан Рокс 250 мл засыпаем лёд на полный объём стакана. Матчу заливаем кипятком 40 мл и перемешиваем капучинатором. В стакан наливаем молоко (не взбиваем!), сверху вливаем матчу. ОБЯЗАТЕЛЬНО предложить гостю сделать на альтернативном молоке и/или добавить сироп, чтобы вкус был ярче и насыщеннее!",
            description: "Освежающий холодный напиток на основе молока и зелёного чая матча. Нежно-зелёный матча-латте с травяными, чуть сладковатыми нотками. Он бодрит, как кофе, но действует мягче.",
            serving: "Рокс 250 мл."
        },
        {
            name: "Матча-колада",
            volume: "350 мл",
            category: "матча",
            ingredients: ["Зелёная матча (1,5 г)", "Молоко кокосовое (140 мл)", "Концентрат ананас (40 г)", "Лёд (полный стакан)"],
            extra: "",
            technology: "Завариваем матчу в 40 мл кипятка и взбиваем капучинатором. Стакан Хайбол 350 мл наполняем льдом на полный объём. Добавляем молоко, концентрат и сверху аккуратно вливаем матчу, создавая градиент.",
            description: "Тропический напиток на кокосовом молоке с яркой нотой ананаса и утончённым послевкусием зелёной матчи.",
            serving: "Хайбол 350 мл."
        },
        {
            name: "Матча кокос клубника крем",
            volume: "500 мл",
            category: "матча",
            ingredients: ["Матча-шот", "Клубничное пюре ПФ (50 гр)", "Молоко кокосовое (100 мл)", "Сахарный сироп ПФ (20 мл)", "Крем клубничный (80 гр)", "Малиновый порошок (1 гр)"],
            extra: "",
            technology: "Готовим матчу шот: вода горячая 30 мл добавляем 1,5 гр зеленой матчи, перемешиваем капучинатором на высоких оборотах до полного размешивания. Готовим крем: сливки шантипак 45 мл наливаем в питчер, добавляем безлактозное молоко 25 мл, сироп клубнику 10 мл все взбиваем капучинатором до однородной массы консистенция сметаны. Берем хайбол 500 мл заполняем полностью льдом. Вливаем клубничное пюре ПФ 50 гр. Далее вливаем кокосовое молоко 100 мл и сахарный сироп. Сверху вливаем матчу-шот. Сверху выкладываем крем и украшаем сублимированным малиновый порошком.",
            description: "Нежный сливочно-йогуртовый вкус, с нежным клубничным послевкусием. Идеально в жаркую погоду.",
            serving: "Подача в кофейне в хайболе 500 мл с прозрачной трубочкой. С собой в пластиковом стакане плотном на 500 мл, с крышкой для кофе и трубочкой прозрачной."
        }
    ];

    const grid = document.getElementById('cardGrid');
    const searchInput = document.getElementById('searchInput');
    let currentCategory = 'all';

    function renderCards() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        let html = '';
        let visibleCount = 0;

        drinks.forEach(d => {
            const categoryMatch = currentCategory === 'all' || d.category === currentCategory;
            const searchMatch = searchTerm === '' ||
                d.name.toLowerCase().includes(searchTerm) ||
                d.ingredients.some(i => i.toLowerCase().includes(searchTerm)) ||
                d.technology.toLowerCase().includes(searchTerm) ||
                d.description.toLowerCase().includes(searchTerm) ||
                (d.extra && d.extra.toLowerCase().includes(searchTerm));
            const show = categoryMatch && searchMatch;
            if (show) visibleCount++;

            const ingredientsHtml = d.ingredients.map(i => `<span class="ingredient-item">${i}</span>`).join('');

            let extraHtml = '';
            if (d.extra && d.extra.trim() !== '') {
                extraHtml = `<div class="section"><div class="section-title">Дополнительные ингредиенты</div><div class="section-content"><span class="extra">${d.extra}</span></div></div>`;
            }

            const cardHtml = `
                <div class="card ${show ? '' : 'hidden'}">
                    <div class="card-header">
                        <h2>${d.name}</h2>
                        <span class="volume">${d.volume}</span>
                    </div>
                    <div class="category-tag">${d.category}</div>
                    <div class="section">
                        <div class="section-title">Состав</div>
                        <div class="section-content ingredient-list">${ingredientsHtml}</div>
                    </div>
                    ${extraHtml}
                    <div class="section">
                        <div class="section-title">Технология</div>
                        <div class="section-content">${d.technology}</div>
                    </div>
                    <div class="section">
                        <div class="section-title">Вкусное описание</div>
                        <div class="section-content">${d.description}</div>
                    </div>
                    <div class="section">
                        <div class="section-title">Подача</div>
                        <div class="section-content">${d.serving}</div>
                    </div>
                </div>
            `;
            html += cardHtml;
        });

        if (visibleCount === 0) {
            html = `<div class="empty">Ничего не найдено. Попробуйте изменить запрос.</div>`;
        }

        grid.innerHTML = html;
    }

    function applyFilters() {
        renderCards();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            renderCards();
        });
    });

    renderCards();
</script>
</body>
</html>
