<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>База знаний — Смузи, Лимонады, Милкшейки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #faf7f2;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #3e2723;
            margin-bottom: 6px;
        }
        .header .sub {
            color: #6d4c41;
            font-size: 15px;
            border-left: 4px solid #a1887f;
            padding-left: 12px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            align-items: center;
        }
        .search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 12px 18px 12px 48px;
            border-radius: 60px;
            border: 1px solid #d7ccc8;
            background: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .search-wrap input:focus {
            border-color: #8d6e63;
            box-shadow: 0 4px 12px rgba(109,76,65,0.15);
        }
        .search-wrap::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            opacity: 0.6;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: #efebe9;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #4e342e;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: #8d6e63;
            color: white;
        }
        .filter-btn:active {
            transform: scale(0.95);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #efe6e0;
            display: flex;
            flex-direction: column;
            transition: 0.15s;
        }
        .card.hidden {
            display: none;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }
        .card-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #3e2723;
            margin: 0;
        }
        .volume {
            background: #efebe9;
            color: #4e342e;
            font-size: 14px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .category-tag {
            font-size: 12px;
            background: #e0d6cf;
            color: #4e342e;
            padding: 2px 10px;
            border-radius: 30px;
            align-self: flex-start;
            margin: 4px 0 8px;
        }
        .section {
            margin-top: 12px;
            border-top: 1px solid #f1ebe7;
            padding-top: 10px;
        }
        .section:first-of-type {
            border-top: none;
            padding-top: 0;
        }
        .section-title {
            font-weight: 600;
            font-size: 14px;
            color: #6d4c41;
            margin-bottom: 4px;
        }
        .section-content {
            font-size: 14px;
            line-height: 1.6;
            color: #3e2723;
        }
        .ingredient-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }
        .ingredient-item {
            background: #f5f0ec;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
        }
        .extra {
            background: #fce4ec;
            color: #c62828;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-top: 4px;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #8d6e63;
            font-size: 18px;
            grid-column: 1 / -1;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            color: #a1887f;
            font-size: 13px;
            border-top: 1px solid #e0d6cf;
            padding-top: 24px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>База знаний кофейни</h1>
        <div class="sub">Технологические карты: смузи, лимонады, милкшейки</div>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Поиск по названию или ингредиенту..." oninput="applyFilters()">
        </div>
        <div class="filter-buttons" id="filterButtons">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="смузи">Смузи</button>
            <button class="filter-btn" data-category="лимонад">Лимонады</button>
            <button class="filter-btn" data-category="милк шейки">Милкшейки</button>
        </div>
    </div>

    <div class="grid" id="cardGrid"></div>

    <div class="footer">Обновлено: 22.09.2026 · Версия 1.0</div>
</div>

<script>
    // ============================================================
    // ДАННЫЕ — СМУЗИ, ЛИМОНАДЫ, МИЛКШЕЙКИ
    // ============================================================
    const drinks = [
        // ===== СМУЗИ =====
        {
            name: "Зеленый смузи",
            volume: "250 мл",
            category: "смузи",
            ingredients: ["Базилик свежий (7 гр)", "Сок яблоко (100 мл)", "Банан (50 гр)", "Киви (30 гр)", "Лед (пару кубиков)", "Базилик свежий (1 гр, украшение)"],
            extra: "",
            technology: "Все компоненты взбить в блендере вместе со льдом. Переливаем в рокс и украшаем базиликом.",
            description: "Свежий вкус в сочетании киви, зеленого яблока и сладости спелого банана, подчеркнутый нотами базилика.",
            serving: "Подается в роксе."
        },
        {
            name: "Малина-Банан смузи",
            volume: "250 мл",
            category: "смузи",
            ingredients: ["Банан (150 гр)", "Малина зам. (50 гр)", "Сок персик (100 мл)", "Лед (пару кубиков)", "Сублимированная малина (1 гр, украшение)"],
            extra: "",
            technology: "Все компоненты взбить в блендере вместе со льдом. Переливаем в рокс и украшаем сублимированной малиной.",
            description: "Приятное сочетание сладкого банана и ягодной легкой кислинки малины.",
            serving: "Подается в роксе."
        },

        // ===== ЛИМОНАДЫ =====
        {
            name: "Лимонад Малина-Базилик",
            volume: "300 мл",
            category: "лимонад",
            ingredients: ["Малина зам. (10 гр)", "Пюре малина (50 гр)", "Базилик (4 гр)", "Сироп малина (10 мл)", "Спрайт (100 мл)", "Содовая (80 мл)", "Лед"],
            extra: "",
            technology: "В хайбол добавляем лед, пюре малины, базилик, сироп, малину зам., спрайт и содовую и все перемешиваем барной ложкой. Украшаем базиликом.",
            description: "Насыщенный ягодный вкус свежей малины гармонично сочетается с яркой зеленой ноткой свежего базилика, что придает лимонаду необычную изысканность. Легкая кислинка цитрусовой основы сочетается со сладостью малины, а базилик добавляет свежести и оттеняет вкус.",
            serving: "Напиток выдается в хайболе 350 мл с трубочкой."
        },
        {
            name: "Клубничный мохито",
            volume: "350 мл",
            category: "лимонад",
            ingredients: ["Пюре клубника п/ф (40 г)", "Сироп клубника (10 мл)", "Газированная вода (130 мл)", "Лайм (20 г, 4 дольки)", "Мята (5 г)", "Лёд (полный стакан)"],
            extra: "",
            technology: "На дно стакана добавляем лайм и мяту, разминаем толкушкой, чтобы они дали сок. Наполняем Хайбол 350 мл льдом на полный объём стакана. Замороженное клубничное пюре разминаем толкушкой с небольшим добавлением кипятка. Добавляем в стакан пюре, сироп, газированную воду и перемешиваем барной ложкой.",
            description: "Освежающий лимонад с ярким вкусом клубники, кислинкой лайма и мятным ароматом.",
            serving: "Хайбол 350 мл."
        },
        {
            name: "Лимонад Персик-Розмарин",
            volume: "350 мл",
            category: "лимонад",
            ingredients: ["Концентрат персик (40 г)", "Сок персик (50 мл)", "Газированная вода (100 мл)", "Лайм (20 г, 4 дольки)", "Розмарин (2 г, 2 веточки)", "Лёд (полный стакан)"],
            extra: "",
            technology: "На дно стакана добавляем лайм и розмарин, разминаем толкушкой, чтобы они дали сок. Наполняем Хайбол 350 мл льдом на полный объём стакана. Добавляем сок, концентрат и газированную воду. Перемешиваем барной ложкой.",
            description: "Яркий лимонад с бархатистой персиковой сладостью и благородным хвойно-цитрусовым оттенком розмарина.",
            serving: "Хайбол 350 мл."
        },
        {
            name: "Лимонад Лаванда-Чёрная смородина",
            volume: "350 мл",
            category: "лимонад",
            ingredients: ["Газированная вода (70 мл)", "Спрайт (70 мл)", "Пюре чёрная смородина п/ф (40 г)", "Сироп лаванда (10 мл)", "Тимьян (1 г, 2 веточки)", "Лёд (полный стакан)"],
            extra: "",
            technology: "Наполняем Хайбол 350 мл льдом на полный объём стакана. Разминаем замороженное пюре смородины толкушкой (при необходимости можно добавить кипяток). В стакан заливаем пюре, сироп, воду и спрайт. Тщательно перемешиваем. Украшаем веточкой тимьяна.",
            description: "Ягодный лимонад с неожиданным цветочным акцентом — кисло-сладкая смородина уравновешивается ароматными нотками лаванды.",
            serving: "Хайбол 350 мл."
        },
        {
            name: "Лимонад Манго-Маракуйя",
            volume: "350 мл",
            category: "лимонад",
            ingredients: ["Апельсиновый фреш (100 мл)", "Газированная вода (90 мл)", "Сироп манго (10 мл)", "Концентрат маракуйя (15 г)", "Апельсин (1/2 кружочка, 10 г)", "Мята (1 г, 2 веточки)", "Лёд (2/3 стакана)"],
            extra: "",
            technology: "Стакан хайбол 350 мл наполняем льдом на 2/3 объёма стакана, добавляем сироп и концентрат, воду, сверху вливаем фреш, перемешиваем барной ложкой (либо для сохранения градиента не перемешивать, но обязательно указывать гостю на необходимость перемешать!), добавляем по бокам апельсин и мяту. Сверху украшаем веточкой мяты.",
            description: "Освежающий фруктовый лимонад на основе апельсинового фреша с сочной маракуйей и сладким манго. Мята с долькой апельсина добавляют яркий цитрусовый акцент.",
            serving: "Хайбол 350 мл."
        },

        // ===== МИЛКШЕЙКИ =====
        {
            name: "Милкшейк Орео",
            volume: "300 мл",
            category: "милк шейки",
            ingredients: ["ЗМЖ (150 гр)", "Молоко коровье (160 мл)", "Сливки взбитые (30 гр)", "Орео (30 гр, 2 печеньки внутрь, 1 на украшение)"],
            extra: "",
            technology: "Все ингредиенты смешать в блендере и хорошо сбить до однородной массы. Перелить в хайбол 300 мл, украсить взбитыми сливками и на шапочку положить печенье.",
            description: "Молочный вкус с любимым печеньем орео, в меру сладкий.",
            serving: "В хайболе 350 мл."
        },
        {
            name: "Милкшейк Сникерс",
            volume: "300 мл",
            category: "милк шейки",
            ingredients: ["ЗМЖ (150 гр)", "Молоко коровье (160 мл)", "Паста арахисовая (20 гр)", "Взбитые сливки (30 гр)", "Арахис (3 гр, украшение)", "Карамель (10 мл, внутрь + украшение)"],
            extra: "",
            technology: "ЗМЖ, молоко, арахисовая паста, карамель — смешиваем все ингредиенты в блендере и взбиваем до однородной массы. Переливаем в хайбол, украшаем взбитыми сливками, арахисом и карамелью.",
            description: "Сладкий молочный коктейль со вкусом арахиса и карамели.",
            serving: "В хайболе 350 мл."
        },
        {
            name: "Милкшейк Ванильный",
            volume: "300 мл",
            category: "милк шейки",
            ingredients: ["ЗМЖ (150 гр)", "Молоко коровье (160 мл)", "Сироп ваниль (15 мл)", "Взбитые сливки (30 гр)"],
            extra: "",
            technology: "ЗМЖ, молоко и сироп смешиваем в блендере, тщательно сбиваем до однородной массы. Переливаем в хайбол, украшаем взбитыми сливками.",
            description: "Классический ванильный молочный коктейль.",
            serving: "В хайболе 350 мл."
        },
        {
            name: "Милкшейк Клубника-Банан",
            volume: "300 мл",
            category: "милк шейки",
            ingredients: ["ЗМЖ (50 гр)", "Молоко коровье (160 мл)", "Банан (50 гр)", "Сироп клубника (15 мл)", "Сироп банан (7 мл)", "Взбитые сливки (30 гр)", "Криспи шарики (1 гр, украшение)"],
            extra: "",
            technology: "ЗМЖ, молоко, сливки, банан и сиропы взбить в блендере до однородной массы. Перелить в хайбол 300 мл, украсить взбитыми сливками и криспи шариками.",
            description: "Классический молочный коктейль со вкусом клубника-банан.",
            serving: "В хайболе 350 мл."
        }
    ];

    // ============================================================
    // РЕНДЕР И ФИЛЬТРАЦИЯ
    // ============================================================
    const grid = document.getElementById('cardGrid');
    const searchInput = document.getElementById('searchInput');
    let currentCategory = 'all';

    function renderCards() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        let html = '';
        let visibleCount = 0;

        drinks.forEach(d => {
            const categoryMatch = currentCategory === 'all' || d.category === currentCategory;
            const searchMatch = searchTerm === '' ||
                d.name.toLowerCase().includes(searchTerm) ||
                d.ingredients.some(i => i.toLowerCase().includes(searchTerm)) ||
                d.technology.toLowerCase().includes(searchTerm) ||
                d.description.toLowerCase().includes(searchTerm) ||
                (d.extra && d.extra.toLowerCase().includes(searchTerm));
            const show = categoryMatch && searchMatch;
            if (show) visibleCount++;

            const ingredientsHtml = d.ingredients.map(i => `<span class="ingredient-item">${i}</span>`).join('');

            let extraHtml = '';
            if (d.extra && d.extra.trim() !== '') {
                extraHtml = `<div class="section"><div class="section-title">➕ Дополнительные ингредиенты</div><div class="section-content"><span class="extra">${d.extra}</span></div></div>`;
            }

            const cardHtml = `
                <div class="card ${show ? '' : 'hidden'}">
                    <div class="card-header">
                        <h2>${d.name}</h2>
                        <span class="volume">${d.volume}</span>
                    </div>
                    <div class="category-tag">${d.category}</div>
                    <div class="section">
                        <div class="section-title">🛒 Состав</div>
                        <div class="section-content ingredient-list">${ingredientsHtml}</div>
                    </div>
                    ${extraHtml}
                    <div class="section">
                        <div class="section-title">👨‍🍳 Технология</div>
                        <div class="section-content">${d.technology}</div>
                    </div>
                    <div class="section">
                        <div class="section-title">📝 Вкусное описание</div>
                        <div class="section-content">${d.description}</div>
                    </div>
                    <div class="section">
                        <div class="section-title">🍽 Подача</div>
                        <div class="section-content">${d.serving}</div>
                    </div>
                </div>
            `;
            html += cardHtml;
        });

        if (visibleCount === 0) {
            html = `<div class="empty">😕 Ничего не найдено. Попробуйте изменить запрос.</div>`;
        }

        grid.innerHTML = html;
    }

    function applyFilters() {
        renderCards();
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentCategory = this.dataset.category;
            renderCards();
        });
    });

    renderCards();
</script>
</body>
</html>
